name: Auto Sync & Keep Alive

on:
  schedule:
    # 每天 UTC 时间 02:00 自动同步
    - cron: '0 2 * * *'
    # 每月 1 号 UTC 时间 03:00 执行保活
    - cron: '0 3 1 * *'
  # 允许手动点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/pdone/lx-music-source.git

      - name: Fetch and Merge
        run: |
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || echo "No new commits to merge"

      - name: Push changes to origin
        run: git push origin main

      - name: Keep alive (Monthly)
        run: |
          echo "Keep alive at $(date)" >> keepalive.txt
          git add keepalive.txt
          git commit -m "Monthly keep alive" || echo "No changes to commit"
          git push origin main
