name: Auto Sync & Keep Alive

on:
  schedule:
    # 每天 UTC 时间 02:00 自动同步（北京 10:00）
    - cron: '0 2 * * *'
    # 每月 1 号 UTC 时间 03:00 执行保活
    - cron: '0 3 1 * *'
  # 允许手动点击运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/pdone/lx-music-source.git

      # 合并上游；有冲突时立即报错退出（不静默吞掉），仓库会收到一封失败通知邮件
      - name: Fetch and Merge
        run: |
          git fetch upstream
          git checkout main
          if git merge upstream/main --no-edit; then
            echo "Merged upstream/main"
          else
            # .health-state.json 和 README.md 是自动生成文件，本地与上游两边机器人都会写，
            # 冲突时直接以上游为准，避免每天撞车失败
            git checkout --theirs .health-state.json README.md 2>/dev/null || true
            git add .health-state.json README.md 2>/dev/null || true
            if git diff --name-only --diff-filter=U | grep -q .; then
              git merge --abort || true
              echo "::error::合并上游失败：存在非自动生成文件的冲突，需手动处理"
              exit 1
            fi
            git commit --no-edit
            echo "Merged upstream/main（自动生成文件冲突已按上游解决）"
          fi

      - name: Push changes to origin
        run: git push origin main

      # 只在每月 1 号的定时触发或手动触发时保活，避免每天制造一个垃圾提交
      - name: Keep alive (Monthly)
        if: ${{ github.event.schedule == '0 3 1 * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Keep alive at $(date)" >> keepalive.txt
          git add keepalive.txt
          git commit -m "Monthly keep alive" || echo "No changes to commit"
          git push origin main
